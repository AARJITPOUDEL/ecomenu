<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16291F">
<meta name="description" content="Annapurna Eco Lodge Resort in Astam, Kaski — a working farm on the ridge above Pokhara.">
<title>About · Annapurna Eco Lodge Resort</title>

<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="shell">

  <header class="nav">
    <a class="nav__brand" href="index.html">
      <img class="nav__logo" src="assets/logo.svg" alt="">
      <span class="nav__name">Annapurna<br><span class="nav__name-sub">Eco Lodge Resort</span></span>
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="index.html">Menu</a>
      <a href="about.html" aria-current="page">About</a>
    </nav>
  </header>

  <section class="hero hero--about">
    <p class="hero__place">Astam, Kaski</p>
    <h1 class="hero__title">About us</h1>
    <p class="hero__tagline" id="lede"></p>

    <svg class="hero__ridge" viewBox="0 0 400 96" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 74 L42 44 L72 58 L112 28 L152 54 L192 30 L232 50 L272 24 L312 48 L352 36 L400 62 L400 96 L0 96 Z" fill="rgba(233,237,228,0.16)"/>
      <path d="M0 84 L50 64 L92 74 L132 56 L176 72 L216 59 L262 76 L302 61 L346 74 L400 67 L400 96 L0 96 Z" fill="#E9EDE4"/>
    </svg>
  </section>

  <main class="about">
    <div class="about__gallery">
      <img class="about__photo" src="assets/image.jpg" alt="Annapurna Eco Lodge Resort">
      <img class="about__logo" src="assets/logo.jpg" alt="Annapurna Eco Lodge Resort logo">
    </div>

    <div class="about__story" id="story"></div>

    <h2 class="about__heading">How we work</h2>
    <div class="panel" id="highlights"></div>

    <h2 class="about__heading">Finding us</h2>
    <div class="panel panel--pad">
      <div class="fact">
        <span class="fact__label">Address</span>
        <span class="fact__value" id="address"></span>
      </div>
      <div class="fact">
        <span class="fact__label">Kitchen</span>
        <span class="fact__value" id="hours"></span>
      </div>
      <div class="fact">
        <span class="fact__label">Phone</span>
        <span class="fact__value" id="phones"></span>
      </div>
    </div>

    <a class="cta" href="index.html">Read the menu</a>
  </main>

  <footer class="footer">
    <p class="footer__note" id="footerNote"></p>
    <a class="footer__link" href="index.html">Back to the menu</a>
  </footer>

</div>

<script src="js/about.js" defer></script>
</body>
</html>
